# Слой между Ozon Seller API и Knowledge Units.
# Юнит знает только metric_id. Привязку к инструменту/полю держит ТОЛЬКО этот файл.
# scope: product — метрика по товару; store — по магазину.
version: 1

metrics:

  # ── из инструмента get_products (scope: product) ──
  price:
    name: "Текущая цена"
    source: seller_api
    tool: get_products
    scope: product
    field: price
    type: number
    unit: RUB
    availability: available

  stock:
    name: "Остаток"
    source: seller_api
    tool: get_products
    scope: product
    field: stock
    type: number
    unit: units
    availability: available

  orders_30d:
    name: "Заказов за 30 дней (по товару)"
    source: seller_api
    tool: get_products
    scope: product
    field: orders_30d
    type: number
    unit: orders
    availability: requires_subscription

  reviews_count:
    name: "Отзывы по товару"
    source: seller_api
    tool: get_products
    scope: product
    field: reviews_count
    type: number
    unit: reviews
    availability: available

  # ── из инструмента get_sales_analytics (scope: store) ──
  revenue_30d:
    name: "Выручка магазина за 30 дней"
    source: seller_api
    tool: get_sales_analytics
    scope: store
    field: revenue
    type: number
    unit: RUB
    availability: available

  orders_store_30d:
    name: "Заказов магазина за 30 дней"
    source: seller_api
    tool: get_sales_analytics
    scope: store
    field: orders
    type: number
    unit: orders
    availability: requires_subscription

  sessions:
    name: "Сессии магазина за 30 дней"
    source: seller_api
    tool: get_sales_analytics
    scope: store
    field: sessions
    type: number
    unit: sessions
    availability: requires_subscription

  # ── внешний рынок: search_competitors (mock v1) ──
  competitor_avg_price:
    name: "Средняя цена конкурентов"
    source: external_market
    tool: search_competitors
    field: price
    aggregation: avg
    type: number
    unit: RUB
    availability: available

  competitor_avg_rating:
    name: "Средний рейтинг конкурентов"
    source: external_market
    tool: search_competitors
    field: rating
    aggregation: avg
    type: number
    unit: rating
    availability: available

  competitor_avg_reviews:
    name: "Среднее число отзывов у конкурентов"
    source: external_market
    tool: search_competitors
    field: reviews_count
    aggregation: avg
    type: number
    unit: reviews
    availability: available

  # ── calculated (считает Formula Engine, НЕ LLM) ──
  conversion:
    name: "Конверсия магазина в заказ"
    source: calculated
    formula: conversion_rate
    inputs: [orders_store_30d, sessions]
    type: percent
    unit: "%"
    availability: derived

  stock_days:
    name: "На сколько дней хватит остатка"
    source: calculated
    formula: stock_days
    inputs: [stock, orders_30d]
    type: number
    unit: days
    availability: derived

  price_vs_market:
    name: "Отклонение цены от рынка"
    source: calculated
    formula: price_vs_market
    inputs: [price, competitor_avg_price]
    type: percent
    unit: "%"
    availability: derived
